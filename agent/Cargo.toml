[package]
name = "pf-fleet-agent"
version = "0.1.2"
edition = "2021"
description = "Runs Pirate Face `pf work` lanes on a node and reports to the pf-fleet dashboard"
publish = false

[dependencies]
anyhow = "1.0.104"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
libc = "0.2.191"
# ring instead of aws-lc-rs: no C/cmake toolchain needed for static musl cross builds
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt", "macros", "process", "time", "sync", "signal", "io-util", "fs"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
uuid = { version = "1.29.3", features = ["v4"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
